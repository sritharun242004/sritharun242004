name: Generate Snake GIF

on:
  schedule:
    - cron: "0 2 * * *"        # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/make_snake.py"
      - ".github/workflows/snake-gif.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet Pillow

      - name: Fetch contribution calendar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -f query='query($u:String!){user(login:$u){contributionsCollection{contributionCalendar{weeks{contributionDays{contributionCount color weekday}}}}}}' -f u=${{ github.repository_owner }} > contrib.json

      - name: Build snake GIF
        run: python scripts/make_snake.py contrib.json assets/snake.gif

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/snake.gif
          if git diff --staged --quiet; then
            echo "No change in snake gif."
          else
            git commit -m "chore: refresh contribution snake gif"
            git push
          fi
